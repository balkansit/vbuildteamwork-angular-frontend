<app-auth-layout [imageSrc]="sideBannerImage" [imagePosition]="'left'" [layoutType]="'split'">
  <div maincontent class="login-container w-75 ">


    <div class="register-container">
      <img [src]="imageSrc" class="logo img-fluid " alt="Logo" />
      <h3 class="login-title">Regis<span class="color-a">tration</span></h3>
      <p class="text-muted">Please complete create your account</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Full name</label>
            <div class="input-icon">
              <input type="text" class="form-control" placeholder="Enter your name" formControlName="full_name" />
              <i class="bi bi-person"></i>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Shop name</label>
            <div class="input-icon">
              <input type="text" class="form-control" placeholder="Enter your shop name" formControlName="shop_name" />
              <i class="bi bi-shop"></i>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <div class="input-icon">
              <input type="text" class="form-control" placeholder="Enter your location" formControlName="location" />
              <i class="bi bi-geo-alt"></i>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Address</label>
            <div class="input-icon">
              <input type="text" class="form-control" placeholder="Enter your address" formControlName="address" />
              <i class="bi bi-geo"></i>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <div class="input-icon">
              <input type="email" class="form-control" placeholder="Enter your email" formControlName="email" />
              <i class="bi bi-envelope"></i>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter your password"
                formControlName="password" />

              <span class="input-group-text bg-transparent border-0 px-0">
                <i class="bi bi-lock"></i>
              </span>

              <button type="button" class="btn border-0 bg-transparent eyeicon px-2"
                (click)="togglePasswordVisibility()" tabindex="-1">
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Password Confirmation</label>
            <div class="input-group">
              <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
                placeholder="Enter your confirm password" formControlName="password_confirmation" />

              <span class="input-group-text bg-transparent border-0 px-0">
                <i class="bi bi-lock-fill"></i>
              </span>

              <button type="button" class="btn border-0 bg-transparent eyeicon px-2"
                (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
                <i class="fas" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="col-md-6 mb-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">Next</button>
          </div>
        </div>
      </form>
    </div>


    <!-- <app-bootstrap-alert *ngIf="errorMessage" [message]="errorMessage" type="danger"
      (close)="clearError()"></app-bootstrap-alert>
    <auth-form [fields]="fields" (formSubmit)="onSubmit($event)" [buttonLabel]="'Login'"
      [isLoading]="isLoading"></auth-form> -->

    <div class="mt-3 text-start">
      <span>Already have an account?</span>
      <a routerLink="/auth/login" class="ms-1">login</a>
    </div>
  </div>
</app-auth-layout>

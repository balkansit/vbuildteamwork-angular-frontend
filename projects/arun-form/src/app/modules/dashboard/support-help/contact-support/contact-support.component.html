<div class="main-wrapper py-5">
  <div class="page-wrapper container">
    <div class="content">
      <!-- Header -->
      <div class="page-header mb-4 text-center">
        <h4 class="fw-bold text-primary">Contact Support</h4>
        <p class="text-muted">If you need assistance, please fill out the form below.</p>
      </div>

      <!-- Card -->
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form>
            <!-- Name -->
            <div class="form-group mb-3">
              <label for="name" class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control rounded-3" id="name" placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div class="form-group mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control rounded-3" id="email" placeholder="Enter your email" required>
            </div>

            <!-- Subject -->
            <div class="form-group mb-3">
              <label for="subject" class="form-label fw-semibold">Subject</label>
              <input type="text" class="form-control rounded-3" id="subject" placeholder="Subject of your inquiry"
                required>
            </div>

            <!-- Message -->
            <div class="form-group mb-4">
              <label for="message" class="form-label fw-semibold">Message</label>
              <textarea class="form-control rounded-3" id="message" rows="5" placeholder="Write your message here..."
                required></textarea>
            </div>

            <!-- Button -->
            <div class="text-end">
              <button type="submit" class="btn btn-primary btn-lg">
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="p-3">
    <h5 class="fw-bold text-primary mb-3">Reopen Day Override</h5>
    <p class="text-muted small mb-4">Select the user for whom you want to reopen the daily operations for this table.</p>

    <div class="form-group mb-4">
        <label class="form-label fw-600">User</label>
        <select class="form-select" [(ngModel)]="selectedUserId">
            <option [value]="null" disabled>Select user...</option>
            <option *ngFor="let user of users" [value]="user.id">
                {{ user.name }} (ID: {{ user.id }})
            </option>
        </select>
        <div *ngIf="loading" class="mt-2 small text-info">
            <i class="fas fa-spinner fa-spin me-1"></i> Loading users...
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <button class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
        <button class="btn btn-success" [disabled]="!selectedUserId || loading" (click)="onSubmit()">
            <i class="fas fa-unlock me-1"></i> Reopen for User
        </button>
    </div>
</div>

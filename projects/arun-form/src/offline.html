<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - My Application</title>
    <style>
        body {
            
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
            color: #333;
        }
        h1 {
            color: #dc3545;
            font-size: 2em;
            margin-top: 20px;
        }
        p {
            font-size: 1.2em;
            color: #666;
            margin: 20px 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops!</h1>
        <p>It seems you are offline. Please check your internet connection and try again.</p>
        <p>If you continue to experience issues, please contact support or visit us later.</p>
        <a href="/" class="button">Return to Home</a>
    </div>
</body>
</html>

<form [formGroup]="form" (ngSubmit)="submit()">

  <div *ngFor="let field of fields" class="mb-3">
    <label [for]="field.name">{{field.label}}</label>

    <!-- Input field -->
    <input *ngIf="field.type === 'input'" 
           [id]="field.name" 
           type="text" 
           [placeholder]="field.placeholder" 
           class="form-control" 
           [formControlName]="field.name" />

    <!-- Dropdown/select field -->
    <select *ngIf="field.type === 'dropdown'" 
            [id]="field.name" 
            class="form-select" 
            [formControlName]="field.name">
      <option value="">Select {{field.label}}</option>
      <option *ngFor="let opt of field.options" [value]="opt.key">{{opt.value}}</option>
    </select>

    <!-- Date field -->
    <input *ngIf="field.type === 'date'" 
           [id]="field.name" 
           type="date" 
           class="form-control" 
           [formControlName]="field.name" />

    <div *ngIf="form.controls[field.name].invalid && (form.controls[field.name].touched || form.controls[field.name].dirty)" class="text-danger">
      {{field.label}} is required
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>

</form>

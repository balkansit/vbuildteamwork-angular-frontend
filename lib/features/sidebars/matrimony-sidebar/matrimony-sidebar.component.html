<div class="sidebar-inner slimscroll" [class.collapsed]="isSidebarCollapsed">
    <div>

    <div id="sidebar-navmenu" class="sidebar-navmenu">
        <div style="margin-bottom: 0; padding-bottom: 0;">
            <div class="sidebar-logo" *ngIf="!isSidebarCollapsed">
                <img [src]="logo" alt="Logo" class="img-fluid" style="display:block; max-height:80px; height:auto; margin:0 auto;">
            </div>
            <div class="sidebar-logo collapsed-logo" *ngIf="isSidebarCollapsed">
                <img [src]="logo" alt="Logo" class="img-fluid" style="display:block; max-height:80px; height:auto; margin:0 auto;">
            </div>
        </div>
        <ul>
            <li class="bs-nav-menu" *ngFor="let section of SidebarMenu; let i = index">
                <h6 class="bs-nav-menu-h6 d-flex align-items-center justify-content-between sidebar-sec-title"
                    (click)="toggleSection(i)">
                    <!-- Left side: image + text -->
                    <div class="d-flex align-items-center gap-2 ms-3">
                        <!-- <img [src]="section.image" alt="{{ section.label | translate }}" class="img-fluid"
                            style="width: 30px; height: 30px; object-fit: contain;" /> -->

                        <i [class]="section.icon" style="color: white !important;"></i>

                        <span class="sidebar-sec-title" style="color: white !important;">{{ section.label | translate
                            }}</span>
                    </div>

                    <!-- Right side: chevron icon -->
                    <i *ngIf="!isSidebarCollapsed" class="fas" [ngClass]="{
       'fa-chevron-down': expandedSection === i,
       'fa-chevron-right': expandedSection !== i
     }">
                    </i>
                </h6>

                <hr style="margin:  0; border-top: 1px solid #ccc;">
                <ul *ngIf="!section.collapsed || isSidebarCollapsed === true">
                    <li *ngFor="let item of section.items">
                        <a routerLinkActive="active" [routerLink]="item.path" [matTooltip]="item.tooltip"
                            [routerLinkActiveOptions]="{ exact: true }">
                            <!-- <img [src]="item.image" alt="{{ section.label }}" class="img-fluid"
                                style="width: 30px; height: 30px; object-fit: contain; justify-items: 10px;" /> -->
                            <i [class]="item.icon"></i>
                            <span>{{ item.label | translate }}</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</div>

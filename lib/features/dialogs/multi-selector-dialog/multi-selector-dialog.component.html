<h1 mat-dialog-title>{{ title }}</h1>

<div class="container-fluid">
  <div class="row p-2">
    <!-- 🔍 Global Search -->
    <div class="col mb-2">
      <input #searchInput type="text" class="form-control form-control-sm" placeholder="Search..."
        (keyup)="applyFilterGlobal($event)" />
    </div>

    <mat-dialog-content>
      <table mat-table [dataSource]="dataSource" class="table table-striped table-hover table-bordered"
        style="width: 100%; font-size: 0.9rem;">
        <!-- ✅ Checkbox Column -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="text-center" style="width: 40px;">
            <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"
              (change)="toggleSelectAll($event)" />
          </th>
          <td mat-cell *matCellDef="let row" class="text-center">
            <input type="checkbox" [checked]="selectedItems.includes(row)" (change)="toggleSelection(row)" />
          </td>
        </ng-container>
        <!-- ✅ Dynamic Columns -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef class="fw-semibold bg-secondary text-white">
            {{ columnHeaders[column] || column }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>
        <!-- ✅ Header & Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumnsWithSelect"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumnsWithSelect"
          [class.table-primary]="selectedItems.includes(row)"></tr>
      </table>
      <!-- ⚠️ No Data -->
      <div *ngIf="dataSource.data.length === 0" class="alert alert-warning text-center mt-3">
        No data available
      </div>
      <!-- 📄 Pagination -->
      <div class="d-flex justify-content-end mt-2">
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-dialog-content>
    <!-- ✅ Buttons -->
    <div class="mt-3 text-end">
      <button class="btn btn-primary btn-sm me-2" [disabled]="selectedItems.length === 0" (click)="confirmSelection()">
        Confirm
      </button>
      <button class="btn btn-secondary btn-sm" (click)="close()">Cancel</button>
    </div>
  </div>
</div>

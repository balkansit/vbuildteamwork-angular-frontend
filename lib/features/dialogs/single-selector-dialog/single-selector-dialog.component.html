<h1 mat-dialog-title>{{ title }}</h1>

<div class="container-fluid">
  <div class="row p-2">
    <!-- Global Search -->
    <div class="col mb-2">
      <input #searchInput type="text" class="form-control form-control-sm"
             placeholder="Search..." (keyup)="applyFilterGlobal($event)">
    </div>

    <mat-dialog-content>
      <table mat-table [dataSource]="dataSource" style="width: 100%;">

        <!-- Radio Column -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <input type="radio" name="selectedRow" 
                   [checked]="selectedItem === row"
                   (change)="toggleSelection(row)">
          </td>
        </ng-container>

        <!-- Data Columns -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef> {{ columnHeaders[column] || column }} </th>
          <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumnsWithSelect"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumnsWithSelect"></tr>
      </table>

      <div *ngIf="dataSource.data.length === 0" class="alert alert-warning text-center mt-3">
        No data available
      </div>

      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
    </mat-dialog-content>

    <!-- Confirm & Cancel -->
    <div class="mt-3 text-end">
      <button class="btn btn-primary" [disabled]="!selectedItem" (click)="confirmSelection()">
        Confirm
      </button>
      <button class="btn btn-secondary" (click)="close()">Cancel</button>
    </div>
  </div>
</div>

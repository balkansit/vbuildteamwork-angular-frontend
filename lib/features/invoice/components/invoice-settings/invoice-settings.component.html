<div class="settings-wrapper">
    <div class="card modern-settings-card">
        <!-- Gradient Header with Navigation and Actions -->
        <div class="settings-header">
            <div class="header-left">
                <button type="button" class="back-btn" title="Go back" (click)="onBack()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-content">
                    <h3>Invoice Configuration</h3>
                    <p>Manage your invoice settings and defaults</p>
                </div>
            </div>
            <div class="header-buttons">
                <button type="button" class="btn btn-light btn-sm" (click)="onReset()" [disabled]="isLoading">
                    <i class="fas fa-redo me-1"></i>Reset
                </button>
            </div>
        </div>

        <!-- Card Body with Form -->
        <div class="card-body">
            <!-- Success Alert -->
            <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
            </div>

            <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">

                <!-- Company Information Section -->
                <h6 class="section-heading">
                    <i class="fas fa-building"></i>Company Information
                </h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" formControlName="company_name"
                            placeholder="Your Company Name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tax/VAT Number</label>
                        <input type="text" class="form-control" formControlName="tax_number" placeholder="XX-XXXXXXXX">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="2" formControlName="address"
                            placeholder="Company address"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email"
                            placeholder="contact@company.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" formControlName="phone" placeholder="+1 (555) 000-0000">
                    </div>
                </div>

                <!-- Invoice Defaults Section -->
                <h6 class="section-heading">
                    <i class="fas fa-sliders-h"></i>Invoice Defaults
                </h6>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Currency Code</label>
                        <input type="text" class="form-control" formControlName="currency_code" placeholder="USD">
                        <div class="form-text">3-letter ISO code (e.g., USD, EUR, GBP)</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Invoice Prefix</label>
                        <input type="text" class="form-control" formControlName="invoice_prefix" placeholder="INV-">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tax Option</label>
                        <div class="mt-2">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" formControlName="tax_enabled"
                                    id="taxSwitch">
                                <label class="form-check-label" for="taxSwitch">Enable Tax</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tax Settings (Conditional) -->
                <div class="row g-3 mt-2" *ngIf="settingsForm.get('tax_enabled')?.value">
                    <div class="col-md-4">
                        <label class="form-label">Default Tax %</label>
                        <input type="number" class="form-control" formControlName="default_tax_percent" placeholder="0"
                            min="0" max="100" step="0.01">
                    </div>
                </div>

                <!-- Footer Text Section -->
                <h6 class="section-heading">
                    <i class="fas fa-file-lines"></i>Invoice Footer
                </h6>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Default Footer Text</label>
                        <textarea class="form-control" rows="2" formControlName="default_footer_text"
                            placeholder="This is a computer generated invoice."></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-outline-secondary" (click)="onReset()" [disabled]="isLoading">
                        <i class="fas fa-times me-2"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="isLoading || settingsForm.invalid">
                        <i class="fas fa-save me-2"></i>
                        {{ isLoading ? 'Saving...' : 'Save Settings' }}
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

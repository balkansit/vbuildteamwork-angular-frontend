<div class="flex justify-between items-center p-4 bg-white rounded-lg shadow-md gap-4 max-w-4xl mx-auto">
    <!-- Left: Product Image -->
    <img [src]="productImage" [alt]="productTitle" class="w-24 h-24 object-cover rounded-md" />

    <!-- Middle: Info & controls -->
    <div class="flex-1 flex flex-col gap-2">
        <h2 class="text-lg font-semibold text-gray-800">{{ productTitle }}</h2>

        <select class="border border-gray-300 rounded px-3 py-1 text-gray-700 w-48" [value]="selectedSpecId"
            (change)="onSpecChange($event)">
            <option *ngFor="let spec of specifications" [value]="spec.id">
                {{ spec.label }}
            </option>
        </select>

        <div class="flex items-center space-x-2 mt-2">
            <button (click)="decreaseQty()" [disabled]="quantity === 1"
                class="p-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-minus"></i>
            </button>
            <input type="number" class="w-12 text-center border border-gray-300 rounded" [value]="quantity" readonly />
            <button (click)="increaseQty()" [disabled]="quantity === maxQuantity"
                class="p-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-plus"></i>
            </button>

            <span *ngIf="inStock; else outOfStock"
                class="flex items-center space-x-1 text-green-600 font-semibold text-sm">
                <i class="fa-solid fa-circle-check"></i>
                <span>In Stock</span>
            </span>
            <ng-template #outOfStock>
                <span class="flex items-center space-x-1 text-red-600 font-semibold text-sm">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>Out of Stock</span>
                </span>
            </ng-template>
        </div>

        <div *ngIf="deliverable" class="flex items-center space-x-1 text-blue-600 text-sm mt-1">
            <i class="fa-solid fa-truck"></i>
            <span>Deliverable to your address</span>
        </div>
    </div>

    <!-- Right: Total Price & Delete -->
    <div class="flex flex-col items-end space-y-4">
        <span class="text-xl font-bold text-gray-900">${{ totalPrice.toFixed(2) }}</span>
        <button (click)="delete.emit()" aria-label="Remove item"
            class="text-red-600 hover:text-red-800 p-2 rounded-full hover:bg-red-100 transition">
            <i class="fa-solid fa-trash fa-lg"></i>
        </button>
    </div>
</div>

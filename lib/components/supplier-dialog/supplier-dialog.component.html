<h1 mat-dialog-title>Select Supplier</h1>
<!-- Filterbox Section -->
<div class="row bits-table-filterbox" style="padding: 10px; background: #f8f9fa;">
  <div class="col-12" style="display:flex; gap: 10px; ">
    <div style="width:200%;">
      <input type="text" class="form-control" placeholder="Search Supplier by Name" (keyup)="applyFilter($event)">
    </div>
    <div style="width:200%;">
      <button class="btn btn-secondary btn-sm" (click)="refreshTable()">Refresh Table</button>
    </div>
  </div>
</div>
<div mat-dialog-content>

  <app-alert *ngIf="alertMessage" [message]="alertMessage.message" [type]="alertMessage.type || 'info'"
    (close)="clearAlert()" style="margin-top: 10px; margin-bottom: 10px;"></app-alert>
  <mat-progress-bar *ngIf="!isLoaded" mode="indeterminate"></mat-progress-bar>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let supplier">{{ supplier.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Supplier Name</th>
    <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
  </ng-container>

  <!-- Header and Row Declarations -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectSupplier(row)" style="cursor: pointer;"></tr>

</table>

</div>

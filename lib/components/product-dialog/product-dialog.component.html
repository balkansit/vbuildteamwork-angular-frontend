<h1 mat-dialog-title>Select Product</h1>
  <!-- Filterbox Section -->
  <div class="row bits-table-filterbox" style="padding: 10px; background: #f8f9fa;">
    <div class="col-12" style="display:flex; gap: 10px; ">
      <div style="width:200%;">
        <input type="text" class="form-control" placeholder="Search product" (keyup)="applyFilter($event)">
      </div>
      <div style="width:200%;">
        <input type="text" class="form-control" placeholder="Search HSN Code" (keyup)="searchByHSNCode($event)">
      </div>
      <div style="width:200%;">
        <button class="btn btn-secondary btn-sm" (click)="refreshTable()">Refresh Table</button>
      </div>
    </div>
  </div>
<div mat-dialog-content>

  <!-- Bootstrap Alert -->
  <app-alert *ngIf="alertMessage" [message]="alertMessage.message" [type]="alertMessage.type || 'info'"
    (close)="clearAlert()" style="margin-top: 10px; margin-bottom: 10px;"></app-alert>
    <mat-progress-bar *ngIf="!isLoaded" mode="indeterminate"></mat-progress-bar>
  <table mat-table [dataSource]="dataSource">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let product">{{ product.id }}</td>
    </ng-container>

    <!-- Product Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Product Name</th>
      <td mat-cell *matCellDef="let product">{{ product.product_name }}</td>
    </ng-container>

    <!-- HSN Code Column -->
    <ng-container matColumnDef="hsn">
      <th mat-header-cell *matHeaderCellDef>HSN Code</th>
      <td mat-cell *matCellDef="let product">{{ product.hsn_code}}</td>
    </ng-container>

    <!-- Table Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectProduct(row)" style="cursor: pointer;">
    </tr>
  </table>
</div>

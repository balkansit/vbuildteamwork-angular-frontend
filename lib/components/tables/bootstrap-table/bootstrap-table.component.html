<table class="table" [class.striped]="stripedRows" [class.hoverable]="highlightRowOnHover"
    [class.border-radius]="borderRadius" [class.elevation]="elevation">
    <thead>
        <tr>
            <th *ngIf="showSelect">
                <input type="checkbox" (change)="toggleSelectAll($event)" />
            </th>
            <th *ngFor="let col of columns" (click)="
          sortable && (col.sortable !== false)
            ? sort(col.field)
            : null
        " [class.sortable]="sortable && col.sortable !== false" [style.width]="col.width || null"
                [class]="col.headerClass || null">
                {{ col.header }}
                <span *ngIf="sortable && sortColumn === col.field" class="sort-arrow">
                    <span *ngIf="sortDirection === 'asc'">&#9650;</span>
                    <span *ngIf="sortDirection === 'desc'">&#9660;</span>
                </span>
            </th>
            <th *ngIf="showActions">Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let row of displayedData" [class.selected]="isSelected(row)">
            <td *ngIf="showSelect">
                <input type="checkbox" [checked]="isSelected(row)" (change)="toggleRowSelection(row)" />
            </td>
            <td *ngFor="let col of columns" [class]="col.cellClass || null">
                <ng-container *ngIf="col.showChip; else normalCell">
                    <span class="chip">{{ row[col.field] }}</span>
                </ng-container>
                <ng-template #normalCell>{{ row[col.field] }}</ng-template>
            </td>
            <td *ngIf="showActions" class="action-column">
                <button class="btn btn-sm btn-outline-primary" (click)="onAction('edit', row)" title="Edit">
                    &#9998;
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="onAction('delete', row)" title="Delete">
                    &#10060;
                </button>
            </td>
        </tr>
    </tbody>
</table>

<nav *ngIf="pagination" class="pagination-container">
    <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
            <a class="page-link" href="javascript:void(0)">Previous</a>
        </li>
        <li class="page-item" *ngFor="let page of totalPagesArray()" [class.active]="page === currentPage"
            (click)="goToPage(page)">
            <a class="page-link" href="javascript:void(0)">{{ page }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages()" (click)="goToPage(currentPage + 1)">
            <a class="page-link" href="javascript:void(0)">Next</a>
        </li>
    </ul>
</nav>

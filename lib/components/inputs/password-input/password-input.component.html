<div class="form-group position-relative w-100">
    <label [for]="name" class="form-label input-label">{{ label }}</label>

    <div class="input-group custom-input-group" [ngClass]="{
      'is-invalid': errorMessage,
      'is-focused': isFocused,
      'is-disabled': disabled
    }">
        <!-- Optional prefix icon -->
        <div *ngIf="prefixIcon" class="input-group-text border-0 bg-transparent px-2">
            <i class="fas" [ngClass]="prefixIcon"></i>
        </div>

        <input [attr.id]="name" [attr.name]="name" [type]="inputType" class="form-control border-0 bg-transparent"
            [placeholder]="placeholder" [value]="value" [disabled]="disabled" [required]="required"
            (input)="onInput($event)" (blur)="onBlur()" (focus)="onFocus()" />

        <!-- Toggle visibility button -->
        <button type="button" class="btn border-0 bg-transparent eyeicon px-2" (click)="toggleVisibility()"
            tabindex="-1">
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
    </div>

    <div *ngIf="errorMessage" class="invalid-feedback d-block">
        {{ errorMessage }}
    </div>
</div>

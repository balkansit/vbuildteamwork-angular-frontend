<div class="relative bg-white rounded-2xl shadow-lg p-4 w-full max-w-sm">
    <!-- Product Image & Badges -->
    <div class="relative">
        <img [src]="selectedImage" alt="Product Image" class="rounded-xl w-full h-64 object-cover">

        <!-- Top Left: Badge -->
        <div class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full">
            {{ product.badge }}
        </div>

        <!-- Top Right: Favorite Icon -->
        <button class="absolute top-2 right-2 bg-white p-1 rounded-full shadow">
            ❤️
        </button>

        <!-- Side Icons -->
        <div class="absolute top-16 right-2 space-y-2">
            <button class="bg-white p-2 rounded-full shadow">🔁</button>
            <button class="bg-white p-2 rounded-full shadow">👁️</button>
            <button class="bg-white p-2 rounded-full shadow">🔗</button>
        </div>
    </div>

    <!-- Thumbnails -->
    <div class="flex space-x-2 mt-3 overflow-x-auto">
        <img *ngFor="let img of product.images" (click)="selectImage(img)" [src]="img"
            class="w-14 h-14 rounded-lg border cursor-pointer" [class.border-blue-500]="img === selectedImage" />
    </div>

    <!-- Product Info -->
    <div class="mt-4">
        <h3 class="text-lg font-semibold">{{ product.title }}</h3>

        <!-- Rating -->
        <div class="text-sm text-yellow-500">
            ⭐⭐⭐⭐☆ ({{ product.reviews }} reviews)
        </div>

        <!-- Price -->
        <!-- Price -->
        <div class="flex items-center gap-2 mt-2">
            <span class="text-xl font-bold text-green-600">{{ formatPrice(product.offerPrice) }}</span>
            <span class="line-through text-gray-500">{{ formatPrice(product.originalPrice) }}</span>
        </div>


        <!-- Countdown -->
        <div *ngIf="countdownEnd" class="text-sm text-red-600 mt-1">
            Offer ends in: {{ timeLeft }}
        </div>

        <!-- Quantity & Add to Cart -->
        <div class="flex items-center gap-2 mt-4">
            <button (click)="decrement()" class="px-2 py-1 border rounded">-</button>
            <span class="w-6 text-center">{{ quantity }}</span>
            <button (click)="increment()" class="px-2 py-1 border rounded">+</button>
            <button (click)="addToCart()" class="ml-auto bg-blue-600 text-white px-4 py-2 rounded-xl">
                Add to Cart
            </button>
        </div>
    </div>
</div>

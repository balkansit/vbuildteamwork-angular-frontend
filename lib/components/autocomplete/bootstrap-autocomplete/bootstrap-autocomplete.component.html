<div class="dropdown w-100 position-relative">
    <input type="text" class="form-control" [placeholder]="placeholder" [(ngModel)]="query" (input)="onInputChange()"
        (focus)="onInputFocus()" (blur)="onInputBlur()" autocomplete="off" />

    <ul class="dropdown-menu show w-100 mt-1" *ngIf="dropdownOpen && filteredOptions.length > 0">
        <li *ngFor="let option of filteredOptions">
            <a class="dropdown-item" (mousedown)="selectOption(option)">
                {{ option.name }}
            </a>
        </li>
    </ul>
</div>

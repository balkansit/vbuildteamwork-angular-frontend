<h2 mat-dialog-title>Generate CSV</h2>
<div mat-dialog-content>
  <p>Select a date range for your report:</p>
  <mat-form-field appearance="outline" class="w-full">
    <!-- <mat-label>Date Range</mat-label> -->
    <mat-select [(value)]="selectedRange">
      <mat-option *ngFor="let option of dateOptions" [value]="option.value">
        {{ option.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()">Download</button>
</div>
